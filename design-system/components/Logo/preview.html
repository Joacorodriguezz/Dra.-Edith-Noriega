<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap"><link rel="stylesheet" href="/styles/tokens.css"><link rel="stylesheet" href="/styles/design-system.css"></head><body><div class="en-stage" style="gap:var(--space-6)">
